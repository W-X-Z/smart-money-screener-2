name: daily-pension-signals

on:
  schedule:
    - cron: "10 7 * * 1-5"  # 평일 16:10 KST (장 마감 15:30 이후 투자자별 데이터 공개)
    - cron: "40 9 * * 1-5"  # 평일 18:40 KST 재수집 (당일 값이 바뀌었으면 반영)
  workflow_dispatch:
    inputs:
      from:
        description: "시그널 재계산 시작일 YYYYMMDD (비우면 마지막 거래일)"
        required: false
      to:
        description: "시그널 재계산 종료일 YYYYMMDD (비우면 마지막 거래일)"
        required: false

permissions:
  contents: write

concurrency:
  group: signals-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Detect signals
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          ARGS=()
          for pair in "from:$FROM" "to:$TO"; do
            name="${pair%%:*}"; value="${pair#*:}"
            [ -z "$value" ] && continue
            [[ "$value" =~ ^[0-9]{8}$ ]] || { echo "잘못된 날짜: $value"; exit 1; }
            ARGS+=("--$name" "$value")
          done
          python -m batch.daily "${ARGS[@]}"

      - name: Commit signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data research/archive
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "일배치 시그널 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase
          git push
