name: daily-pension-signals

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 늦거나 빠질 수 있어 여러 번 건다. 매번 같은 결과를 덮어쓰므로 중복 실행해도 안전.
    - cron: "10 7 * * 1-5"   # 평일 16:10 KST (장 마감 15:30 이후 투자자별 데이터 공개)
    - cron: "25 8 * * 1-5"   # 평일 17:25 KST
    - cron: "40 9 * * 1-5"   # 평일 18:40 KST (당일 값이 바뀌었으면 반영)
    - cron: "10 12 * * 1-5"  # 평일 21:10 KST
    - cron: "10 14 * * 1-5"  # 평일 23:10 KST
  workflow_dispatch:
    inputs:
      from:
        description: "시그널 재계산 시작일 YYYYMMDD (비우면 마지막 거래일)"
        required: false
      to:
        description: "시그널 재계산 종료일 YYYYMMDD (비우면 마지막 거래일)"
        required: false

permissions:
  contents: write

concurrency:
  group: signals-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Detect signals
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          ARGS=()
          for pair in "from:$FROM" "to:$TO"; do
            name="${pair%%:*}"; value="${pair#*:}"
            [ -z "$value" ] && continue
            [[ "$value" =~ ^[0-9]{8}$ ]] || { echo "잘못된 날짜: $value"; exit 1; }
            ARGS+=("--$name" "$value")
          done
          python -m batch.daily "${ARGS[@]}"

      - name: Commit signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data research/archive
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          LAST=$(python -c "import json; c = json.load(open('research/archive/calendar.json')); print(max(k for k, v in c.items() if v == 'open'))")
          git commit -m "일배치 시그널 $LAST (실행 $(TZ=Asia/Seoul date '+%m-%d %H:%M'))"
          # GitHub 이 가끔 500 으로 푸시를 거절해서 몇 번 다시 시도한다
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
