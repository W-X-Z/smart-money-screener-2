<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연기금 시그널</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #f5f5f3;
  --surface: #ffffff;
  --surface-2: #f5f5f3;
  --control: #ebeae6;
  --border: #e8e7e3;
  --grid: #efeeea;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #8a8983;
  --buy: #e34948;
  --sell: #2a78d6;
  --line: #52514e;
  --focus: #2a78d6;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --bg: #111110;
    --surface: #1a1a19;
    --surface-2: #232322;
    --control: #232322;
    --border: #2c2c2a;
    --grid: #262624;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --text-3: #8f8e86;
    --buy: #e66767;
    --sell: #3987e5;
    --line: #c3c2b7;
    --focus: #3987e5;
    --shadow: 0 8px 32px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
.meta { color: var(--text-3); font-size: 13px; white-space: nowrap; }

.toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
.seg { display: inline-flex; background: var(--control); border-radius: 10px; padding: 3px; flex: none; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.seg.sm button { padding: 5px 10px; font-size: 13px; }
.info { border: 0; background: none; padding: 0 2px; margin-left: 2px; cursor: pointer; color: var(--text-3); vertical-align: -3px; line-height: 0; }
.info svg { width: 15px; height: 15px; stroke: currentColor; }
.info[aria-expanded="true"] { color: var(--text); }
.pop { position: fixed; z-index: 20; max-width: 260px; background: var(--text); color: var(--bg); font-size: 13px; line-height: 1.5; padding: 9px 12px; border-radius: 10px; box-shadow: var(--shadow); display: none; }
.pop.open { display: block; }
[hidden] { display: none !important; }
.coach { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--text); color: var(--bg); font-size: 13px; padding: 7px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap; opacity: .92; transition: opacity .4s; }
.coach.hide { opacity: 0; }
.fbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 14px; color: var(--text-2); flex: none; }
.fbtn svg { width: 16px; height: 16px; stroke: currentColor; }
.fbtn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--buy); display: none; }
.fbtn.custom .dot { display: inline-block; }
.fbtn[aria-expanded="true"] { color: var(--text); border-color: var(--text-3); }
.fcard { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px 16px; margin-bottom: 12px; }
.fcard.open { display: block; }
.frow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.frow + .frow { border-top: 1px solid var(--border); }
.frow .lbl { font-size: 14px; color: var(--text); }
.frow .lbl small { display: block; font-size: 12px; color: var(--text-3); margin-top: 1px; }
.switch { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; margin: 0; border-radius: 999px; background: var(--control); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch:checked { background: var(--focus); }
.switch:checked::after { transform: translateX(16px); }
.switch:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.fstats { justify-content: space-between; font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.fstats b { color: var(--text); font-weight: 600; }
.pill.mute { color: var(--text-3); }
.more { text-align: center; color: var(--text-3); font-size: 13px; padding: 16px 0; }
.ct .rng { display: inline-flex; gap: 2px; font-weight: 500; }
.rng button { border: 0; background: none; font-size: 12px; color: var(--text-3); padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.rng button[aria-pressed="true"] { background: var(--control); color: var(--text); }
svg.c { touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: crosshair; }
.v.up { color: var(--buy); }
.v.down { color: var(--sell); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.search { flex: 1; min-width: 0; position: relative; }
.search input {
  width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
  padding: 0 12px 0 34px; font: inherit; font-size: 14px; color: var(--text); outline: none;
}
.search input:focus { box-shadow: 0 0 0 2px var(--focus); }
.search svg { position: absolute; left: 12px; top: 10px; width: 16px; height: 16px; stroke: var(--text-3); }

.list { background: var(--surface); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
.item {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 14px 16px; border: 0; background: none; cursor: pointer; border-top: 1px solid var(--border);
}
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.item .dd { width: 44px; flex: none; font-variant-numeric: tabular-nums; }
.item .dd b { display: block; font-size: 15px; font-weight: 600; }
.item .dd span { font-size: 12px; color: var(--text-3); }
.item .nm { flex: 1; min-width: 0; }
.item .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .sub { font-size: 13px; color: var(--text-3); margin-top: 1px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; color: var(--buy); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
.amt { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; color: var(--buy); white-space: nowrap; text-align: right; }
.chg { display: block; font-size: 12px; font-weight: 500; color: var(--text-3); margin-top: 1px; }
.chg.up { color: var(--buy); } .chg.down { color: var(--sell); }
.chev { width: 16px; height: 16px; stroke: var(--text-3); flex: none; }
.empty { text-align: center; color: var(--text-3); padding: 64px 0; }

/* panel */
.scrim { touch-action: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.scrim.open { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface);
  box-shadow: var(--shadow); transform: translateX(100%); transition: transform .25s ease; z-index: 11;
  display: flex; flex-direction: column;
}
.panel.open { transform: none; }
.panel-h { display: flex; align-items: flex-start; justify-content: space-between; padding: 22px 22px 6px; }
.panel-h h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
.panel-h .sub { color: var(--text-3); font-size: 13px; margin-top: 2px; }
.x { border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: none; }
.x svg { width: 14px; height: 14px; stroke: var(--text-2); }
.panel-b { padding: 12px 22px 28px; overflow-y: auto; overscroll-behavior: contain; flex: 1; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0 22px; }
.kpi .s { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.kpi { background: var(--surface-2); border-radius: 12px; padding: 12px; }
.kpi .k { font-size: 12px; color: var(--text-3); }
.kpi .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .v.buy { color: var(--buy); }
.ct { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--text-2); margin: 4px 0 6px; }
.lg { display: flex; gap: 10px; font-weight: 500; color: var(--text-3); font-size: 12px; }
.lg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.chart { position: relative; margin-bottom: 18px; }
svg.c { display: block; width: 100%; overflow: visible; }
svg.c text { fill: var(--text-3); font-size: 11px; font-family: inherit; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); display: none; white-space: nowrap; z-index: 2; }
.tip b { display: block; margin-bottom: 2px; }
.tip span { color: var(--text-2); display: block; }
.link { border: 0; background: none; color: var(--text-3); font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.dt { margin-top: 10px; display: none; border-radius: 10px; border: 1px solid var(--border); }
.dt.open { display: block; }
.dt table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.dt th, .dt td { padding: 7px 12px; text-align: right; border-bottom: 1px solid var(--border); }
.dt th:first-child, .dt td:first-child { text-align: left; }
.dt th { color: var(--text-3); font-weight: 500; position: sticky; top: -12px; background: var(--surface); box-shadow: 0 1px 0 var(--border); }
.state { color: var(--text-3); text-align: center; padding: 60px 0; }

@media (max-width: 600px) {
  .wrap { padding: 20px 16px 48px; }
  .toolbar { flex-wrap: wrap; }
  .search { flex-basis: 100%; order: 3; }
  .panel { top: auto; width: 100%; height: 88vh; border-radius: 18px 18px 0 0; transform: translateY(100%); }
  .panel.open { transform: none; }
  .panel-h { padding: 18px 16px 4px; }
  .frow { flex-wrap: wrap; }
  .panel-b { padding: 10px 16px 28px; }
  .dt th { top: -10px; }
}
@media (prefers-reduced-motion: reduce) { .panel, .scrim { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>연기금 시그널</h1>
    <span class="meta" id="meta"></span>
  </header>

  <div class="toolbar">
    <div class="seg" id="market" role="group" aria-label="시장">
      <button data-v="" aria-pressed="true">전체</button>
      <button data-v="코스피" aria-pressed="false">코스피</button>
      <button data-v="코스닥" aria-pressed="false">코스닥</button>
    </div>
    <button class="fbtn" id="fbtn" aria-expanded="false" aria-controls="fcard">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>필터<span class="dot"></span>
    </button>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="종목명·코드 검색" aria-label="종목명이나 코드로 검색">
    </label>
  </div>

  <div class="fcard" id="fcard">
    <div class="frow"><div class="lbl">연기금 매수 금액<i data-tip="이틀 연속 샀다면 두 날을 합쳐요."></i></div>
      <div class="seg sm" data-f="amount" role="group" aria-label="연기금 매수 금액"><button data-v="1">1억 이상</button><button data-v="3">3억 이상</button><button data-v="5">5억 이상</button></div></div>
    <div class="frow"><div class="lbl">사기 전 한 달간 연기금 거래<i data-tip="매수일 전 20거래일 중 연기금이 3천만 원 넘게 사고판 날 수예요."></i></div>
      <div class="seg sm" data-f="silence" role="group" aria-label="사기 전 한 달간 연기금 거래"><button data-v="0">없음</button><button data-v="1">하루까지</button><button data-v="2">이틀까지</button></div></div>
    <div class="frow"><div class="lbl">규모에 비해 작은 매수 빼기<i data-tip="5억 미만 매수는 평소 하루 거래대금의 5%를 넘을 때만 보여요."></i></div><input type="checkbox" class="switch" data-f="scale" aria-label="규모에 비해 작은 매수 빼기"></div>
    <div class="frow"><div class="lbl">이틀 연속 산 종목도 보기</div><input type="checkbox" class="switch" data-f="two_day" aria-label="이틀 연속 산 종목도 보기"></div>
    <div class="frow"><div class="lbl">우선주도 보기</div><input type="checkbox" class="switch" data-f="pref" aria-label="우선주도 보기"></div>
    <div class="frow fstats"><span id="stats"></span><button class="link" id="reset" type="button">기본값으로</button></div>
  </div>

  <main id="list"><div class="empty">불러오고 있어요</div></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="p-name" aria-hidden="true">
  <div class="panel-h">
    <div><h2 id="p-name"></h2><div class="sub" id="p-sub"></div></div>
    <button class="x" id="close" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="panel-b" id="p-body"></div>
</aside>
<div class="pop" id="pop" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const toDate = (d) => new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
const fmtMd = (d) => `${+d.slice(4, 6)}/${+d.slice(6, 8)}`;
const fmtEok = (v, sign = true) => `${sign && v > 0 ? "+" : ""}${+v.toFixed(Math.abs(v) >= 10 ? 1 : 2)}억`;
const fmtWon = (v) => `${Math.round(v).toLocaleString("ko-KR")}원`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>`;

// ---------- 토글팁 ⓘ: 눌러서 열고, 바깥·Esc·스크롤로 닫힌다 (터치에서도 동작) ----------
const INFO_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>`;
const info = (text) => `<button type="button" class="info" aria-label="설명 보기" aria-expanded="false" data-tip="${esc(text)}">${INFO_SVG}</button>`;
document.querySelectorAll("i[data-tip]").forEach((n) => { n.outerHTML = info(n.dataset.tip); });
let tipFor = null;
function hidePop() { $("#pop").classList.remove("open"); if (tipFor) tipFor.setAttribute("aria-expanded", "false"); tipFor = null; }
document.addEventListener("click", (e) => {
  const b = e.target.closest(".info");
  if (!b || b === tipFor) return hidePop();
  hidePop(); tipFor = b; b.setAttribute("aria-expanded", "true");
  const pop = $("#pop"); pop.textContent = b.dataset.tip; pop.classList.add("open");
  const r = b.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = `${Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2))}px`;
  pop.style.top = `${r.bottom + 8 + h > innerHeight ? r.top - h - 8 : r.bottom + 8}px`;
});
addEventListener("scroll", hidePop, true);
addEventListener("resize", hidePop);

// 보여줄 신호 규칙: engine/signals.py PRESETS["추천"] 과 같다 (2년 검증에서 고른 조건)
const RULE = { amount: 3, silence: 0, scale: true, two_day: true, pref: true };
const COOLDOWN = 20; // 같은 종목 재신호 억제 (거래일), engine/signals.py 와 동일
let SIGNALS = [], STATS = null, CURRENT = null, UPDATED = "";
let F = { ...RULE, market: "" };
try { const saved = JSON.parse(localStorage.getItem("pension-filter") || "null"); if (saved) F = { ...F, ...saved }; } catch (e) {}
const isDefault = () => Object.keys(RULE).every((k) => F[k] === RULE[k]);

async function load() {
  const [res, st] = await Promise.all([
    fetch("/data/signals.json", { cache: "no-cache" }),
    fetch("/data/filter_stats.json", { cache: "no-cache" }).catch(() => null),
  ]);
  SIGNALS = res.ok ? await res.json() : [];
  STATS = st && st.ok ? await st.json() : null;
  const last = res.headers.get("last-modified");
  const upd = last ? new Date(last) : null;
  UPDATED = upd ? ` · ${upd.getMonth() + 1}/${upd.getDate()} ${String(upd.getHours()).padStart(2, "0")}:${String(upd.getMinutes()).padStart(2, "0")} 기준` : "";
  syncControls(); render();
}

// engine/signals.py mask() 와 같은 규칙
const passes = (s) => s.buy_eok >= F.amount && (s.big_days ?? 0) <= F.silence
  && (!F.scale || s.buy_eok >= 5 || (s.adv_pct ?? 0) >= 5)
  && (F.two_day || !s.two_day) && (F.pref || !s.pref) && (!F.market || s.market === F.market);

// 같은 종목은 20거래일 안에서 가장 크게 산 날 한 줄만 보여준다 (engine/signals.py cooldown 과 같은 규칙).
// 더 큰 신호가 오면 그 날로 바꾸고 기간도 거기서 다시 센다. 금액 하한을 낮춰도 큰 매수가 작은 신호에 가려지지 않게.
function filtered() {
  const asc = SIGNALS.filter(passes).sort((a, b) => a.date.localeCompare(b.date));
  const last = {}, out = [];
  for (const s of asc) {
    const t = s.tix ?? 0, prev = last[s.code];
    if (prev == null || t - prev.t >= COOLDOWN) { out.push(s); last[s.code] = { t, i: out.length - 1 }; }
    else if (s.buy_eok > out[prev.i].buy_eok) { out[prev.i] = s; last[s.code] = { t, i: prev.i }; }
  }
  return out.reverse();
}

function syncControls() {
  document.querySelectorAll("#market button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === F.market));
  $("#fbtn").classList.toggle("custom", !isDefault());
  $("#reset").hidden = isDefault();
  document.querySelectorAll(".fcard .seg").forEach((g) => g.querySelectorAll("button").forEach((b) =>
    b.setAttribute("aria-pressed", String(F[g.dataset.f]) === b.dataset.v)));
  document.querySelectorAll(".fcard .switch").forEach((c) => { c.checked = !!F[c.dataset.f]; });
  try { localStorage.setItem("pension-filter", JSON.stringify(F)); } catch (e) {}
}

function renderStats() {
  const key = `a${F.amount}_s${F.silence}_r${+F.scale}_d${+F.two_day}_p${+F.pref}`;
  const s = STATS && STATS.stats[key];
  $("#stats").hidden = !(s && s.x20); if (!s || !s.x20) return;
  const pct = (v) => `${v > 0 ? "+" : ""}${v.toFixed(1)}%`;
  const base = STATS.baseline && STATS.baseline.x20 ? STATS.baseline.x20.mean : null;
  const more = `지난 2년 기준이에요. 다음 날 시가에 사서 한 달(20거래일) 뒤 같은 시장·비슷한 시총 종목과 비교한 중간값이에요. `
    + `평균 ${pct(s.x20.mean)}${base != null ? ` (아무 종목이나 샀다면 ${pct(base)})` : ""}, 시장보다 오른 종목 ${s.x20.win}%.`;
  $("#stats").innerHTML = `이 조건이면 주 <b>${s.per_week}건</b> · 한 달 뒤 시장보다 <b>${pct(s.x20.median)}</b>${info(more)}`;
}

const PAGE = 30;
let LIST = [], SHOWN = 0;
function item(s) {
  return `<button class="item" data-key="${esc(s.code)}_${esc(s.date)}">
      <div class="dd"><b>${fmtMd(s.date)}</b><span>${WD[toDate(s.date).getDay()]}</span></div>
      <div class="nm">
        <div class="name">${esc(s.name)}${s.source.startsWith("장중") || s.intraday ? `<span class="pill">장중</span>` : ""}${s.two_day ? `<span class="pill mute">이틀</span>` : ""}</div>
        <div class="sub">${esc(s.code)}${s.market ? ` · ${esc(s.market)}` : ""}</div>
      </div>
      <div class="amt">${fmtEok(s.buy_eok)}${chg(s)}</div>${CHEV}
    </button>`;
}
const todayKST = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10).replace(/-/g, "");
// 신호 다음 날 시가에 샀다면 지금까지 수익률 (이미 많이 올랐는지 보는 용도)
function chg(s) {
  const r = s.ret_pct;
  if (r == null) return `<span class="chg">${s.date === todayKST() ? "오늘 포착" : "장 마감 후 계산"}</span>`;
  return `<span class="chg ${r > 0 ? "up" : r < 0 ? "down" : ""}">이후 ${r > 0 ? "+" : ""}${r.toFixed(1)}%</span>`;
}
function more() {
  const box = $("#list .list"); if (!box || SHOWN >= LIST.length) return;
  box.insertAdjacentHTML("beforeend", LIST.slice(SHOWN, SHOWN + PAGE).map(item).join(""));
  SHOWN = Math.min(SHOWN + PAGE, LIST.length);
  $("#more").textContent = SHOWN < LIST.length ? `${SHOWN} / ${LIST.length}` : "";
}
const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) more(); }, { rootMargin: "400px" });

function render() {
  renderStats();
  const q = $("#q").value.trim().toLowerCase();
  const list = filtered().filter((s) => !q || s.name.toLowerCase().includes(q) || s.code.includes(q));
  $("#meta").textContent = `${list.length}건${UPDATED}`;
  if (!list.length) {
    $("#list").innerHTML = `<div class="empty">${!SIGNALS.length ? "아직 잡힌 종목이 없어요. 평일 오후 4시 10분에 업데이트돼요."
      : q ? `‘${esc(q)}’에 맞는 종목이 없어요. 종목명이나 코드를 다시 확인해 주세요.` : "이 조건에 맞는 종목이 없어요. 필터를 넓혀 보세요."}</div>`;
    return;
  }
  LIST = list; SHOWN = 0;
  $("#list").innerHTML = `<div class="list"></div><div class="more" id="more"></div>`;
  more();
  io.disconnect(); io.observe($("#more"));
}

$("#market").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  F.market = b.dataset.v; syncControls(); render();
});
$("#fbtn").addEventListener("click", () => {
  const open = $("#fcard").classList.toggle("open");
  $("#fbtn").setAttribute("aria-expanded", open);
});
document.querySelectorAll(".fcard .seg").forEach((g) => g.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  F[g.dataset.f] = +b.dataset.v; syncControls(); render();
}));
document.querySelectorAll(".fcard .switch").forEach((c) => c.addEventListener("change", () => {
  F[c.dataset.f] = c.checked; syncControls(); render();
}));
$("#reset").addEventListener("click", () => { F = { ...F, ...RULE }; syncControls(); render(); });
$("#q").addEventListener("input", render);
$("#list").addEventListener("click", (e) => { const b = e.target.closest(".item"); if (b) open(b.dataset.key, b); });

// ---------- panel ----------
let lastFocus = null;
// 상세가 열려 있는 동안 뒤 목록은 스크롤되지 않게 (스크롤바가 사라지며 화면이 밀리지 않도록 폭 보정)
function lockScroll(on) {
  const root = document.documentElement;
  if (on && root.style.overflow !== "hidden") {
    root.style.paddingRight = `${innerWidth - root.clientWidth}px`;
    root.style.overflow = "hidden";
  } else if (!on) {
    root.style.overflow = ""; root.style.paddingRight = "";
  }
}
function close() {
  $("#panel").classList.remove("open"); $("#scrim").classList.remove("open");
  $("#panel").setAttribute("aria-hidden", "true"); CURRENT = null;
  lockScroll(false);
  if (lastFocus) lastFocus.focus();
}
$("#close").addEventListener("click", close);
$("#scrim").addEventListener("click", close);
document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (tipFor) hidePop(); else close(); });
window.addEventListener("resize", () => { if (CURRENT) draw(CURRENT); });

async function open(key, from) {
  lastFocus = from;
  const s = SIGNALS.find((x) => `${x.code}_${x.date}` === key);
  $("#p-name").textContent = s.name;
  $("#p-sub").textContent = `${s.code}${s.market ? " · " + s.market : ""} · ${+s.date.slice(4, 6)}월 ${+s.date.slice(6, 8)}일 매수`
    + ((s.first_seen || s.intraday) ? ` · ${s.first_seen || s.intraday} 포착` : "");
  const ret = s.ret_pct;
  $("#p-body").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="k">연기금 순매수</div><div class="v buy">${fmtEok(s.buy_eok)}</div>${s.two_day ? `<div class="s">이틀 합계</div>` : ""}</div>
      <div class="kpi"><div class="k">평소 거래대금 대비${info("최근 20거래일 하루 평균 거래대금과 비교했어요.")}</div><div class="v">${s.adv_pct != null ? s.adv_pct.toFixed(1) + "%" : "-"}</div></div>
      <div class="kpi"><div class="k">그 전 한 달 최대 거래${info(`매수일 전 20거래일 중 하루 거래가 가장 컸던 금액이에요. 3천만 원 넘은 날은 ${s.big_days ? `${s.big_days}일` : "없어요"}.`)}</div><div class="v">${fmtEok(s.past_max_eok, false)}</div></div>
      <div class="kpi"><div class="k">이후 수익률${info("다음 날 시가에 샀다고 보고 마지막 종가까지 계산했어요.")}</div><div class="v ${ret > 0 ? "up" : ret < 0 ? "down" : ""}">${ret != null ? `${ret > 0 ? "+" : ""}${ret.toFixed(1)}%` : "-"}</div><div class="s">${ret != null ? `${s.ret_days}거래일째` : "다음 거래일 장 마감 후 보여요"}</div></div>
    </div>
    <div class="state" id="p-state">차트를 불러오고 있어요</div>`;
  $("#panel").classList.add("open"); $("#scrim").classList.add("open");
  $("#panel").setAttribute("aria-hidden", "false"); $("#close").focus();
  lockScroll(true); $("#p-body").scrollTop = 0;
  try {
    const res = await fetch(`/data/flow/${encodeURIComponent(s.code)}.json`, { cache: "no-cache" }).catch(() => null);
    if (!res) throw new Error("차트를 불러오지 못했어요. 잠시 후 다시 열어 주세요.");
    if (!res.ok) throw new Error("이 종목 차트는 아직 없어요. 다음 업데이트 때 생겨요.");
    const rows = (await res.json()).rows.filter((r) => r.close > 0);
    const signalDates = new Set([s.date, ...filtered().filter((x) => x.code === s.code).map((x) => x.date)]);
    CURRENT = { rows, signalDates, v0: 0, v1: rows.length - 1 };
    $("#p-state").outerHTML = `
      <div class="ct"><span class="rng" id="rng"><button data-r="22">1개월</button><button data-r="66">3개월</button><button data-r="0" aria-pressed="true">전체</button></span>
        <span class="lg"><span><i style="background:var(--buy)"></i>매수</span><span><i style="background:var(--sell)"></i>매도</span><span>▼ 포착일</span></span></div>
      <div class="ct">연기금 순매수</div>
      <div class="chart" id="c1"></div>
      <div class="ct">종가</div>
      <div class="chart" id="c2"></div>
      <div class="tip" id="tip"></div>
      <button class="link" id="tg">날짜별 숫자 보기</button>
      <div class="dt" id="dt"><table><thead><tr><th>날짜</th><th>연기금 순매수</th><th>종가</th></tr></thead><tbody>${
        [...rows].reverse().map((r) => `<tr><td>${fmtMd(r.dt)}${signalDates.has(r.dt) ? " ▼" : ""}</td><td>${fmtEok(r.pension)}</td><td>${Math.round(r.close).toLocaleString("ko-KR")}</td></tr>`).join("")
      }</tbody></table></div>`;
    $("#tg").addEventListener("click", () => { const t = $("#dt"); t.classList.toggle("open"); $("#tg").textContent = t.classList.contains("open") ? "숫자 접기" : "날짜별 숫자 보기"; });
    $("#rng").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      const n = +b.dataset.r, last = CURRENT.rows.length - 1;
      CURRENT.v0 = n ? Math.max(0, last - n + 1) : 0; CURRENT.v1 = last; draw(CURRENT);
    });
    requestAnimationFrame(() => { draw(CURRENT); coachOnce(); });
  } catch (err) {
    const st = $("#p-state"); if (st) st.textContent = err.message;
  }
}

// 드래그 확대는 보이지 않는 제스처라 처음 한 번만 알려준다
function coachOnce() {
  try { if (localStorage.getItem("seen-zoom")) return; localStorage.setItem("seen-zoom", "1"); } catch (e) { return; }
  const c = document.createElement("div"); c.className = "coach"; c.textContent = "드래그하면 구간을 확대해요";
  $("#c1").appendChild(c);
  const off = () => { c.classList.add("hide"); setTimeout(() => c.remove(), 400); };
  setTimeout(off, 3500); $("#c1").addEventListener("pointerdown", off, { once: true });
}

// ---------- charts (SVG, 한 축씩: 막대 + 선 분리) ----------
const NS = "http://www.w3.org/2000/svg";
const M = { l: 44, r: 4 };
function el(tag, attrs, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
function ticks(min, max, count = 3) {
  const span = max - min || 1, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((x) => x >= raw);
  const out = []; for (let v = Math.floor(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function bar(x, w, y0, y1) {
  const h = Math.abs(y1 - y0), r = Math.min(3, w / 2, h); if (h < 0.5) return "";
  const t = y1 < y0 ? y1 : y1, d = y1 < y0 ? r : -r;
  return `M${x},${y0} V${t + d} Q${x},${t} ${x + r},${t} H${x + w - r} Q${x + w},${t} ${x + w},${t + d} V${y0} Z`;
}
function draw(state) {
  const { signalDates } = state;
  const rows = state.rows.slice(state.v0, state.v1 + 1);
  const b1 = $("#c1"), b2 = $("#c2"); if (!b1 || !rows.length) return;
  const full = state.v0 === 0 && state.v1 === state.rows.length - 1;
  document.querySelectorAll("#rng button").forEach((b) => {
    const n = +b.dataset.r, last = state.rows.length - 1;
    b.setAttribute("aria-pressed", full ? !n : n > 0 && state.v1 === last && state.v0 === last - n + 1);
  });
  b1.innerHTML = ""; b2.innerHTML = "";
  const W = b1.clientWidth, n = rows.length, band = (W - M.l - M.r) / n, X = (i) => M.l + i * band;

  const H1 = 180, T1 = 14, B1 = 20;
  const s1 = el("svg", { class: "c", viewBox: `0 0 ${W} ${H1}`, height: H1, role: "img", "aria-label": "연기금 날짜별 순매수" }, b1);
  const vals = rows.map((r) => r.pension), lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const tk = ticks(lo, hi), yMin = Math.min(lo, tk[0]), yMax = Math.max(hi, tk[tk.length - 1]);
  const y1 = (v) => T1 + (yMax - v) / (yMax - yMin || 1) * (H1 - T1 - B1);
  tk.forEach((t) => {
    el("line", { x1: M.l, x2: W - M.r, y1: y1(t), y2: y1(t), stroke: t === 0 ? "var(--text-3)" : "var(--grid)" }, s1);
    el("text", { x: M.l - 8, y: y1(t) + 4, "text-anchor": "end" }, s1).textContent = `${t}억`;
  });
  const gap = band > 4 ? Math.min(2, band * 0.3) : 0;
  rows.forEach((r, i) => {
    const d = bar(X(i) + gap / 2, Math.max(band - gap, 1), y1(0), y1(r.pension));
    if (d) el("path", { d, fill: r.pension >= 0 ? "var(--buy)" : "var(--sell)" }, s1);
    if (signalDates.has(r.dt)) el("text", { x: X(i) + band / 2, y: T1 - 3, "text-anchor": "middle", style: "fill:var(--text);font-size:10px" }, s1).textContent = "▼";
  });
  axis(s1, rows, X, band, H1 - 4);

  const H2 = 120, T2 = 8, B2 = 20;
  const s2 = el("svg", { class: "c", viewBox: `0 0 ${W} ${H2}`, height: H2, role: "img", "aria-label": "종가" }, b2);
  const cl = rows.map((r) => r.close), pt = ticks(Math.min(...cl), Math.max(...cl), 2);
  const pMin = Math.min(pt[0], ...cl), pMax = Math.max(pt[pt.length - 1], ...cl);
  const y2 = (v) => T2 + (pMax - v) / (pMax - pMin || 1) * (H2 - T2 - B2);
  pt.forEach((t) => {
    el("line", { x1: M.l, x2: W - M.r, y1: y2(t), y2: y2(t), stroke: "var(--grid)" }, s2);
    el("text", { x: M.l - 8, y: y2(t) + 4, "text-anchor": "end" }, s2).textContent = t >= 10000 ? `${(t / 10000).toFixed(t % 10000 ? 1 : 0)}만` : t.toLocaleString("ko-KR");
  });
  rows.forEach((r, i) => { if (signalDates.has(r.dt)) el("line", { x1: X(i) + band / 2, x2: X(i) + band / 2, y1: T2, y2: H2 - B2, stroke: "var(--text-3)", "stroke-dasharray": "3 3" }, s2); });
  el("path", { d: rows.map((r, i) => `${i ? "L" : "M"}${X(i) + band / 2},${y2(r.close)}`).join(""), fill: "none", stroke: "var(--line)", "stroke-width": 2, "stroke-linejoin": "round" }, s2);
  axis(s2, rows, X, band, H2 - 4);

  const guides = [[s1, T1, H1 - B1], [s2, T2, H2 - B2]].map(([s, a, z]) => el("line", { y1: a, y2: z, stroke: "var(--text-2)", visibility: "hidden" }, s));
  const dot = el("circle", { r: 4, fill: "var(--line)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, s2);
  const tip = $("#tip"), body = $("#p-body");
  const sels = [[s1, T1, H1 - B1], [s2, T2, H2 - B2]].map(([s, a, z]) => el("rect", { y: a, height: z - a, fill: "var(--focus)", opacity: 0.15, visibility: "hidden" }, s));
  const idx = (e, svg) => {
    const rect = svg.getBoundingClientRect(), k = rect.width / W;
    return Math.max(0, Math.min(n - 1, Math.floor((e.clientX - rect.left - M.l * k) / (band * k))));
  };
  let drag = null;
  const hover = (e, i) => {
    const r = rows[i], cx = X(i) + band / 2;
    guides.forEach((g) => { g.setAttribute("x1", cx); g.setAttribute("x2", cx); g.setAttribute("visibility", "visible"); });
    dot.setAttribute("cx", cx); dot.setAttribute("cy", y2(r.close)); dot.setAttribute("visibility", "visible");
    tip.innerHTML = `<b>${fmtMd(r.dt)}${signalDates.has(r.dt) ? " · 포착일" : ""}</b><span>연기금 ${fmtEok(r.pension)}</span><span>종가 ${fmtWon(r.close)}</span>`;
    tip.style.display = "block";
    const bb = body.getBoundingClientRect();
    let left = e.clientX - bb.left + 12; if (left + tip.offsetWidth > bb.width - 8) left = e.clientX - bb.left - tip.offsetWidth - 12;
    tip.style.left = `${left}px`; tip.style.top = `${e.clientY - bb.top + body.scrollTop - 12}px`;
  };
  const leave = () => { guides.forEach((g) => g.setAttribute("visibility", "hidden")); dot.setAttribute("visibility", "hidden"); tip.style.display = "none"; };
  const zoomTo = (a, b) => { state.v1 = state.v0 + b; state.v0 = state.v0 + a; draw(state); };
  [s1, s2].forEach((svg) => {
    svg.addEventListener("pointerdown", (e) => { drag = { a: idx(e, svg), b: idx(e, svg) }; svg.setPointerCapture(e.pointerId); });
    svg.addEventListener("pointermove", (e) => {
      const i = idx(e, svg);
      if (!drag) return hover(e, i);
      drag.b = i; leave();
      const lo = Math.min(drag.a, drag.b), hi = Math.max(drag.a, drag.b);
      sels.forEach((r) => { r.setAttribute("x", X(lo)); r.setAttribute("width", (hi - lo + 1) * band); r.setAttribute("visibility", "visible"); });
    });
    svg.addEventListener("pointerup", () => {
      if (!drag) return;
      const lo = Math.min(drag.a, drag.b), hi = Math.max(drag.a, drag.b);
      drag = null;
      sels.forEach((r) => r.setAttribute("visibility", "hidden"));
      if (hi - lo >= 4) zoomTo(lo, hi);
    });
    svg.addEventListener("pointerleave", () => { if (!drag) leave(); });
    svg.addEventListener("dblclick", () => { state.v0 = 0; state.v1 = state.rows.length - 1; draw(state); });
    // 트랙패드 핀치(ctrl+휠)는 화면 대신 그래프를 확대·축소
    svg.addEventListener("wheel", (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      const c = state.v0 + idx(e, svg), span = state.v1 - state.v0;
      const next = Math.max(5, Math.min(state.rows.length - 1, Math.round(span * (e.deltaY > 0 ? 1.25 : 0.8))));
      const ratio = (c - state.v0) / (span || 1);
      state.v0 = Math.max(0, Math.round(c - next * ratio));
      state.v1 = Math.min(state.rows.length - 1, state.v0 + next);
      draw(state);
    }, { passive: false });
  });
}
function axis(svg, rows, X, band, y) {
  const every = Math.ceil(rows.length / Math.max(2, Math.floor((X(rows.length) - X(0)) / 64)));
  rows.forEach((r, i) => { if (i % every === 0) el("text", { x: X(i) + band / 2, y, "text-anchor": "middle" }, svg).textContent = fmtMd(r.dt); });
}

load().catch(() => { $("#list").innerHTML = `<div class="empty">목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>`; });
</script>
</body>
